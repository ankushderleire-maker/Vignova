events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    # Gzip common text payloads (JSON API responses, HTML, CSS)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # --- Shared proxy defaults ---------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # AI generation can take a while; keep timeouts long for all vhosts.
    proxy_read_timeout    300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;

    # -----------------------------------------------------------------
    # Port 80 — ACME challenge + permanent redirect to HTTPS.
    # -----------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Let's Encrypt HTTP-01 challenge.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health endpoint for the docker healthcheck.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Everything else → HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------
    # Backend API — api.vignova.io
    # -----------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.vignova.io;

        ssl_certificate     /etc/letsencrypt/live/api.vignova.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.vignova.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Larger PDF uploads (resume, cover letter) can hit the backend.
        client_max_body_size 25M;

        location / {
            proxy_pass http://backend:8000;
        }
    }

    # -----------------------------------------------------------------
    # Dashboard — app.vignova.io
    # -----------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.vignova.io;

        ssl_certificate     /etc/letsencrypt/live/app.vignova.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.vignova.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://dashboard:3000;
        }
    }

    # -----------------------------------------------------------------
    # Landing — vignova.io / www.vignova.io
    # -----------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name vignova.io www.vignova.io;

        ssl_certificate     /etc/letsencrypt/live/vignova.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vignova.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://landing:80;
        }
    }

    # -----------------------------------------------------------------
    # Fallback — any unknown HTTPS host → landing
    # -----------------------------------------------------------------
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # Use any one cert as a default — browser will warn on wrong host,
        # which is the correct behaviour for an unknown vhost.
        ssl_certificate     /etc/letsencrypt/live/vignova.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vignova.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://landing:80;
        }
    }
}
