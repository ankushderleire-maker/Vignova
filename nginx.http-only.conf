# ============================================================
# nginx.http-only.conf
# ------------------------------------------------------------
# Legacy reference only. The current Compose deployment has no nginx
# container; aaPanel manages the host nginx and app/API certificates.
# vignova.io and www.vignova.io are hosted separately on Hostinger.
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout    300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Route by Host header even on plain HTTP until certs exist.
        location / {
            if ($host = api.vignova.io) {
                proxy_pass http://backend:8000;
            }
            if ($host = app.vignova.io) {
                proxy_pass http://dashboard:3000;
            }
            return 444;
        }
    }
}
