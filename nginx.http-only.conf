# ============================================================
# nginx.http-only.conf
# ------------------------------------------------------------
# Bootstrap config used for the FIRST boot — BEFORE Let's Encrypt
# has issued certificates. Swap this in for `nginx.conf` once,
# run certbot (see DEPLOY_READINESS.md §3), then swap back to the
# TLS-enabled nginx.conf.
#
# Usage:
#   docker compose stop nginx
#   cp nginx.conf nginx.tls.conf                # keep a copy
#   cp nginx.http-only.conf nginx.conf
#   docker compose up -d nginx
#   # run certbot
#   cp nginx.tls.conf nginx.conf
#   docker compose exec nginx nginx -s reload
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout    300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Route by Host header even on plain HTTP until certs exist.
        location / {
            if ($host = api.vignova.io) {
                proxy_pass http://backend:8000;
            }
            if ($host ~* ^(app\.)?vignova\.io$) {
                proxy_pass http://dashboard:3000;
            }
            proxy_pass http://landing:80;
        }
    }
}
