version: '3.8'

services:
  # ----------------------------------------
  # Proxy Layer (NGINX)
  # ----------------------------------------
  nginx:
    image: nginx:alpine
    container_name: vignova-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - landing
      - dashboard
      - backend
    networks:
      - vignova-net
    restart: unless-stopped

  # ----------------------------------------
  # Main Domain (vignova.io)
  # ----------------------------------------
  landing:
    build:
      context: ./resume-saas-v4/LandingCode
      dockerfile: Dockerfile
    container_name: vignova-landing
    expose:
      - "80"
    networks:
      - vignova-net
    restart: unless-stopped

  # ----------------------------------------
  # Subdomain (app.vignova.io)
  # ----------------------------------------
  dashboard:
    build:
      context: ./resume-saas-v4
      dockerfile: Dockerfile
    container_name: vignova-dashboard
    environment:
      - NODE_ENV=production
      # Pull env vars from a .env file on the host at the root of the project
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - db
      - backend
    networks:
      - vignova-net
    restart: unless-stopped

  # ----------------------------------------
  # API Backend (api.vignova.io)
  # ----------------------------------------
  backend:
    build:
      context: ./Backend/Full_Backend
      dockerfile: Dockerfile
    container_name: vignova-backend
    environment:
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db
      - ollama
    networks:
      - vignova-net
    restart: unless-stopped

  # ----------------------------------------
  # Local AI Model Engine
  # ----------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: vignova-ollama
    # Auto-pull the DeepSeek model on startup (blocks until downloaded)
    entrypoint: >
      /bin/sh -c "
      /bin/ollama serve &
      sleep 5 &&
      /bin/ollama pull deepseek-r1:1.5b &&
      wait
      "
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    networks:
      - vignova-net
    restart: unless-stopped

  # ----------------------------------------
  # Database
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: vignova-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-resume_ai_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - vignova-net
    restart: unless-stopped

# ----------------------------------------
# Volumes and Networks
# ----------------------------------------
volumes:
  postgres_data:
  backend_uploads:
  ollama_models:

networks:
  vignova-net:
    driver: bridge
