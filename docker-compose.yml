services:
  # ----------------------------------------
  # Landing (vignova.io)
  # ----------------------------------------
  landing:
    build:
      context: ./LandingCode
    container_name: vignova-landing
    ports:
      - "3001:80"
    restart: unless-stopped

  # ----------------------------------------
  # Dashboard (app.vignova.io)
  # ----------------------------------------
  dashboard:
    build:
      context: ./resume-saas-v4
    container_name: vignova-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
      - backend
    restart: unless-stopped

  # ----------------------------------------
  # Backend (api.vignova.io)
  # ----------------------------------------
  backend:
    build:
      context: ./Backend/Full_Backend
    container_name: vignova-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db
      - ollama
    restart: unless-stopped

  # ----------------------------------------
  # Ollama
  # ----------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: vignova-ollama
    entrypoint: >
      /bin/sh -c "
      /bin/ollama serve &
      sleep 5 &&
      /bin/ollama pull deepseek-r1:1.5b &&
      wait
      "
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # ----------------------------------------
  # Database
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: vignova-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-resume_ai_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
  ollama_models:
