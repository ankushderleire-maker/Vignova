services:
  # ----------------------------------------
  # Landing (vignova.io)
  # ----------------------------------------
  landing:
    build:
      context: ./LandingCode
    container_name: vignova-landing
    ports:
      - "3001:80"
    restart: unless-stopped

  # ----------------------------------------
  # Dashboard (app.vignova.io)
  # ----------------------------------------
  dashboard:
    build:
      context: ./resume-saas-v4
    container_name: vignova-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env
      - ./resume-saas-v4/.env
    environment:
      - AI_BACKEND_URL=http://backend:8000
    depends_on:
      db:
        condition: service_healthy   # wait until pg_isready passes
      backend:
        condition: service_started
    restart: unless-stopped

  # ----------------------------------------
  # Backend (api.vignova.io)
  # ----------------------------------------
  backend:
    build:
      context: ./Backend/Full_Backend
    container_name: vignova-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - WORKERS=2        # gunicorn worker count — raise to 4 on 4-core servers
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://app.vignova.io,https://vignova.io,https://www.vignova.io}
    env_file:
      - .env
      - ./Backend/Full_Backend/.env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy   # backend only starts after Postgres is ready
      ollama:
        condition: service_healthy   # wait for the model to be pulled
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G

  # ----------------------------------------
  # Ollama
  # ----------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: vignova-ollama
    entrypoint: >
      /bin/sh -c "
      /bin/ollama serve &
      sleep 5 &&
      /bin/ollama pull deepseek-r1:1.5b &&
      wait
      "
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      # `ollama list` only returns success once the server is up AND
      # at least the first model has been pulled; this prevents the
      # backend from firing requests against a warming-up Ollama.
      test: ["CMD-SHELL", "ollama list | grep -q deepseek || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------
  # Database
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: vignova-db
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c idle_in_transaction_session_timeout=30000
        -c statement_timeout=60000
        -c lock_timeout=10000
        -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB:       ${DB_NAME:-resume_ai_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres is internal-only — the host port has been removed. If you
    # need to psql from the host, add `-p 5432:5432` at runtime, e.g.
    #   docker compose run --service-ports db
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-resume_ai_saas}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # nginx container removed — aaPanel's host nginx handles SSL/TLS and
  # reverse-proxies to the exposed ports (3000, 3001, 8000) directly.

volumes:
  postgres_data:
  backend_uploads:
  ollama_models:
