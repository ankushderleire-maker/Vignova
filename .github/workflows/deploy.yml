name: Smart Deploy to VPS

on:
  push:
    branches:
      - Deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VIGNOVA_VPS }}
          script: |
            cd /www/wwwroot/Vignova

            echo "Saving current version..."
            PREV_COMMIT=$(git rev-parse HEAD)

            echo "Reset & pull latest..."
            git reset --hard
            git pull origin Deploy

            echo "Detecting changed services..."

            CHANGED=$(git diff --name-only $PREV_COMMIT HEAD)

            REBUILD_LANDING=false
            REBUILD_DASHBOARD=false
            REBUILD_BACKEND=false

            echo "$CHANGED" | grep -q "LandingCode" && REBUILD_LANDING=true
            echo "$CHANGED" | grep -q "resume-saas-v4" && REBUILD_DASHBOARD=true
            echo "$CHANGED" | grep -q "Backend" && REBUILD_BACKEND=true

            echo "Changes detected:"
            echo "Landing: $REBUILD_LANDING"
            echo "Dashboard: $REBUILD_DASHBOARD"
            echo "Backend: $REBUILD_BACKEND"

            echo "Deploying..."

            if [ "$REBUILD_LANDING" = true ]; then
              docker compose up -d --build landing
            fi

            if [ "$REBUILD_DASHBOARD" = true ]; then
              docker compose up -d --build dashboard
            fi

            if [ "$REBUILD_BACKEND" = true ]; then
              docker compose up -d --build backend
            fi

            echo "Running health check..."

            sleep 10

            if ! curl -f http://127.0.0.1:3001 > /dev/null; then
              echo "❌ Deployment failed! Rolling back..."
              git reset --hard $PREV_COMMIT
              docker compose up -d --build
              exit 1
            fi

            echo "✅ Deployment successful!"

            echo "Cleaning unused images..."
            docker image prune -f
