server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — required/recommended by payment gateways
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Clean URL handling:
    #   1. Try exact file  (e.g. /privacy/index.html when trailingSlash is on)
    #   2. Try directory   (e.g. /privacy/ → /privacy/index.html)
    #   3. Try .html       (e.g. /privacy → /privacy.html — fallback for old builds)
    #   4. 404 page
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Custom error page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
